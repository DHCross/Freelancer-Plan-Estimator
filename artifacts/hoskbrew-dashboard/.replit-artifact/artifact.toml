kind = "web"
previewPath = "/"
title = "Freelance Forge"
version = "1.0.0"
id = "artifacts/hoskbrew-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25880

[services.development]
run = "pnpm --filter @workspace/hoskbrew-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hoskbrew-dashboard", "run", "build" ]
publicDir = "artifacts/hoskbrew-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25880"
BASE_PATH = "/"
